<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <script src="colors.js"></script>
  </head>
  <body>
    <div class="popup">
      <header class="popup-header">
        <div class="brand">
          <span class="logo-icon">⚡</span>
          <h1>Heylighter</h1>
        </div>
        <button class="icon-btn" id="helpBtn" title="Help">?</button>
      </header>

      <div class="status-row">
        <div class="status-left">
          <span class="status-dot" id="statusDot"></span>
          <div>
            <div class="status-title">Active on this page</div>
            <div class="status-domain" id="statusDomain">—</div>
          </div>
        </div>
        <span class="count-badge" id="countBadge">0 highlights</span>
      </div>

      <div class="card">
        <div class="card-row">
          <div class="row-text">
            <span class="row-title">Show highlights</span>
            <button class="filter-trigger" id="filterTrigger">
              <span class="row-sub">Show</span>
              <span class="filter-preview" id="filterPreview"></span>
            </button>
          </div>
          <label class="switch">
            <input type="checkbox" id="visibilityToggle" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="filter-popover" id="filterPopover"></div>

        <div class="divider"></div>

        <div class="card-row">
          <span class="row-title">Highlight menu on hover/selection</span>
          <label class="switch">
            <input type="checkbox" id="menuToggle" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="divider"></div>

        <div class="card-row">
          <span class="row-title">Export as</span>
          <div class="pill-buttons">
            <button id="exportJson" class="pill-btn">Json</button>
            <button id="exportWord" class="pill-btn">Word</button>
          </div>
        </div>
      </div>

      <button id="clearPage" class="clear-btn">
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
        </svg>
        Clear page
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
